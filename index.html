        .logistics-row span:last-child { font-weight: 500; color: #333; }

        function showToast(msgKey) {
            const toast = document.getElementById('toast');
            toast.innerText = dict[currentLang][msgKey];
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function detectLanguage() {
            const browserLang = (navigator.language || navigator.userLanguage).split('-')[0].toLowerCase();
            if (['zh', 'en', 'ar', 'es', 'fr'].includes(browserLang)) return browserLang;
            return 'en';
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(dict[lang][key]) el.innerText = dict[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if(dict[lang][key]) el.setAttribute('placeholder', dict[lang][key]);
            });
            renderFilteredProducts();
            renderCart();
            
            if (document.getElementById('page-detail').classList.contains('active') && currentDetailId) {
                showDetail(currentDetailId, true); 
            }
        }

        function getUnit(category) {
            if(currentLang === 'zh') return category === 'spice' ? '公斤' : '盒';
            if(currentLang === 'ar') return category === 'spice' ? 'كغ' : 'صندوق';
            if(currentLang === 'es') return category === 'spice' ? 'kg' : 'caja';
            if(currentLang === 'fr') return category === 'spice' ? 'kg' : 'boîte';
            return category === 'spice' ? 'kg' : 'box';
        }

        function getTrans(p, field) {
            const langField = `${field}_${currentLang}`;
            if (currentLang === 'zh') return p[field] || '';
            return p[langField] || p[field] || ''; 
        }

        function getProductName(p) { return getTrans(p, 'name'); }

        async function fetchProducts() {
            // 显示骨架屏
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = `
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text-group"><div class="skeleton-text"></div><div class="skeleton-text short"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text-group"><div class="skeleton-text"></div><div class="skeleton-text short"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text-group"><div class="skeleton-text"></div><div class="skeleton-text short"></div></div></div>
            `;
            
            const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
            if (!error) { allProducts = data; renderFilteredProducts(); renderCart(); }
        }

        function renderFilteredProducts() {
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = '';
            
            let filtered = currentCategory === 'all' ? allProducts : allProducts.filter(p => p.category === currentCategory);
            
            if (currentSearchQuery.trim() !== '') {
                const query = currentSearchQuery.trim().toLowerCase();
                filtered = filtered.filter(p => {
                    const names = [p.name, p.name_en, p.name_ar, p.name_es, p.name_fr].filter(Boolean);
                    return names.some(n => n.toLowerCase().includes(query));
                });
            }
            
            if (filtered.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:#999; margin-top:20px;">${dict[currentLang].no_search_result}</p>`;
                return;
            }

            filtered.forEach(p => {
                listEl.innerHTML += `
                    <div class="card" onclick="showDetail(${p.id})">
                        <img src="${p.image_url}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1596797038530-2c107229654b?w=400'">
                        <div class="card-info">
                            <div class="card-title">${getProductName(p)}</div>
                            <div class="card-price">${p.price} Pi / ${getUnit(p.category)}</div>
                        </div>
                    </div>
                `;
            });
        }

        function handleSearch() {
            currentSearchQuery = document.getElementById('search-input').value;
            document.getElementById('clear-search-btn').style.display = currentSearchQuery ? 'block' : 'none';
            renderFilteredProducts();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            currentSearchQuery = '';
            document.getElementById('clear-search-btn').style.display = 'none';
            renderFilteredProducts();
        }

        function filterCategory(category, el) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            currentCategory = category;
            renderFilteredProducts();
        }

                if (p.halal) certHtml += `<div class="detail-row"><span>Halal: ${p.halal} <span class="view-cert-btn" onclick="viewCert('${HALAL_CERT_URL}')" data-i18n="view_original">(查看原件)</span></span></div>`;
                certHtml += `</div>`;
            }

            detailEl.innerHTML = `

                    <h3>RWA 链上确权</h3>
                    <p style="font-size:12px; color:#666; line-height:1.6;">本批次仓单资产已托管。当您通过 Pi 支付购买后，系统将自动在 Pi 区块链上生成唯一确权凭证 (TxID)，可在订单中随时溯源查验。</p>

        function goBackFromDetail() {
            if (lastPageBeforeDetail === 'cart') {
                switchPage('cart');
            } else {
                switchPage('home');
            }
        }

        async function addToCart(id) {
            if(!currentUser) { 
                showToast('toast_connect_first'); 
                return; 
            }
            const p = allProducts.find(prod => prod.id === id);
            const existing = cart.find(item => item.id === id);
            if(existing) { 
                if(existing.qty >= p.stock) { alert("库存不足"); return; }
                existing.qty += 1; 
            } else { 
                cart.push({ id: id, qty: 1 }); 
            }
            await syncCartToCloud(); 
            showToast('toast_added');
        }

        async function syncCartToCloud() {
            if (!currentUser) return;
            await supabaseClient.from('carts').delete().eq('username', currentUser);
            if (cart.length > 0) {
                const insertData = cart.map(item => ({ username: currentUser, product_id: item.id, qty: item.qty }));
                await supabaseClient.from('carts').insert(insertData);
            }
            renderCart();
        }

        async function loadCartFromCloud() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient.from('carts').select('*').eq('username', currentUser);
            if (!error && data) {
                cart = data.map(item => ({ id: item.product_id, qty: item.qty }));
                renderCart();
            }
        }

        function renderCart() {
            const listEl = document.getElementById('cart-list');
            const summaryEl = document.getElementById('cart-summary');
            const totalEl = document.getElementById('cart-total-price');
            
            if(cart.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:#999; margin-top:20px;">${dict[currentLang].empty_cart}</p>`;
                summaryEl.style.display = 'none';
                return;
            }
            
            listEl.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                const p = allProducts.find(prod => prod.id === item.id);
                if (!p) return;
                
                total += p.price * item.qty;
                listEl.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info" onclick="showDetail(${p.id})" style="cursor:pointer;">
                            <div style="font-weight:bold;">${getProductName(p)}</div>
                            <div style="color:#d32f2f; font-size:14px; margin-top:4px;">${p.price} Pi / ${getUnit(p.category)}</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                            <button class="del-btn" onclick="deleteCartItem(${index})">🗑️</button>
                        </div>
                    </div>
                `;
            });
            totalEl.innerText = total.toFixed(1) + " Pi";
            summaryEl.style.display = 'block';
        }

        async function updateQty(index, change) {
            const item = cart[index];
            const p = allProducts.find(prod => prod.id === item.id);
            if(change > 0 && item.qty >= p.stock) { alert("库存不足"); return; }
            
            item.qty += change;
            if(item.qty <= 0) cart.splice(index, 1);
            await syncCartToCloud(); 
        }
        
        async function deleteCartItem(index) {
            cart.splice(index, 1);
            await syncCartToCloud();
        }

        function saveAddressInfo() {
            addressInfo = {
                name: document.getElementById('user-name').value,
                code: document.getElementById('user-code').value,
                phone: document.getElementById('user-phone').value,
                address: document.getElementById('user-address').value
            };
            localStorage.setItem('dzpj_address_info', JSON.stringify(addressInfo));
        }

        async function checkoutCart() {
            if (!isAuthenticated) { 
                showToast('toast_connect_first');
                return; 
            }
            if (!addressInfo.name || !addressInfo.code || !addressInfo.phone || !addressInfo.address) { 
                showToast('toast_fill_address');
                switchPage('profile'); 
                return; 
            }
            // 手机号校验 (简单正则)
            if(!/^\d{5,15}$/.test(addressInfo.phone)) {
                showToast('invalid_phone');
                return;
            }
            if (cart.length === 0) return;

            let totalAmount = 0;
            let itemNames = [];
            for(let item of cart) {
                const p = allProducts.find(prod => prod.id === item.id);
                if(!p) continue;
                if(item.qty > p.stock) { alert(`${getProductName(p)} 库存不足`); return; }
                totalAmount += p.price * item.qty;
                itemNames.push(`${getProductName(p)}x${item.qty}`);
            }

            try {
                await Pi.createPayment({
                    amount: totalAmount,
                    memo: "结算: " + itemNames.join(', '),
                    metadata: { cart: cart, addressInfo: addressInfo }
                }, {
                    onReadyForServerApproval: async (paymentId) => {
                        await fetch('/api/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId }) });
                    },
                    onReadyForServerCompletion: async function(paymentId, txid) {
                        const res = await fetch('/api/complete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId, txid }) });
                        if (res.ok) {
                            await supabaseClient.from('orders').insert([{ 
                                username: currentUser, 
                                item_name: itemNames.join(', '), 
                                amount: totalAmount, 
                                txid: txid,
                                address: addressInfo.address,
                                receiver_name: addressInfo.name,
                                country_code: addressInfo.code,
                                phone: addressInfo.phone,
                                status: '待发货'
                            }]);
                            
                            // 扣减库存
                            for(let item of cart) {
                                const p = allProducts.find(prod => prod.id === item.id);
                                if(p) {
                                    const newStock = p.stock - item.qty;
                                    await supabaseClient.from('products').update({ stock: newStock }).eq('id', p.id);
                                }
                            }

                            alert(`支付成功！已生成订单。`);
                            cart = [];
                            await syncCartToCloud();
                            fetchProducts(); // 重新拉取最新库存
                            switchPage('home');
                        } else {
                            alert("防刷单校验失败！");
                        }
                    },
                    onCancel: function() { alert("支付取消"); },
                    onError: function(error) { alert("支付错误"); }
                });
            } catch (error) { alert("创建支付失败"); }
        }

        async function fetchOrders() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient.from('orders').select('*').eq('username', currentUser).order('created_at', { ascending: false });
            const listEl = document.getElementById('order-list');
            if (error || data.length === 0) {
                listEl.innerHTML = `<p style="font-size: 13px; color: #999; text-align: center;">${dict[currentLang].no_orders}</p>`;

        }

        function showLogistics(index) {
            const order = window.userOrders[index];
            const modal = document.getElementById('logistics-modal');
            const timeline = document.getElementById('timeline-container');
            const dictLang = dict[currentLang];

            const orderTime = new Date(order.created_at);
            const formatTime = (date) => {
                return `${date.getMonth()+1}月${date.getDate()}日 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
            };
            const estDeliveryDate = new Date(orderTime);
            estDeliveryDate.setDate(estDeliveryDate.getDate() + 5);
            const estDeliveryStr = `${estDeliveryDate.getMonth()+1}月${estDeliveryDate.getDate()}日`;

            document.getElementById('modal-status-title').innerText = dictLang.status_shipped;
            document.getElementById('modal-est-time').innerText = estDeliveryStr;
            document.getElementById('modal-track-no').innerText = "SF" + Math.floor(Math.random() * 10000000000);
            
            const txidLink = document.getElementById('modal-txid-link');
            txidLink.innerText = order.txid;
            txidLink.href = `https://blockexplorer.minepi.com/testnet/tx/${order.txid}`;
            window.currentTxId = order.txid; // 保存供复制使用

            const logData = [
                { time: new Date(orderTime.getTime() + 1000 * 60 * 60 * 24 * 2), title: dictLang.log_transit, active: true },
                { time: new Date(orderTime.getTime() + 1000 * 60 * 60 * 24 * 1.5), title: dictLang.log_picked, active: true },
                { time: new Date(orderTime.getTime() + 1000 * 60 * 60 * 24 * 1), title: dictLang.log_processing, active: true },
                { time: orderTime, title: dictLang.log_created, active: true }
            ];

            timeline.innerHTML = '';
            logData.forEach(log => {
                timeline.innerHTML += `
                    <div class="timeline-item ${log.active ? 'active' : ''}">
                        <div class="timeline-dot"></div>
                        <div class="timeline-title">${log.title}</div>
                        <div class="timeline-time">${formatTime(log.time)}</div>
                    </div>
                `;
            });

            modal.classList.add('active');
        }
        
        function copyTxId() {
            navigator.clipboard.writeText(window.currentTxId).then(() => {
                showToast('copy_success');
            });
        }

        function closeLogistics(e) {
            if(e && e.target !== e.currentTarget) return;
            document.getElementById('logistics-modal').classList.remove('active');
        }

        function switchPage(pageName, updateNav = true) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageName}`).classList.add('active');
            
            if (updateNav) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                if(pageName === 'home' || pageName === 'detail') {
                    document.getElementById('nav-home').classList.add('active');
                } else {
                    document.getElementById(`nav-${pageName}`).classList.add('active');
                }
            }
            
            if(pageName === 'profile') {
                document.getElementById('user-name').value = addressInfo.name;
                document.getElementById('user-code').value = addressInfo.code;
                document.getElementById('user-phone').value = addressInfo.phone;
                document.getElementById('user-address').value = addressInfo.address;
                fetchOrders(); 
            } else if(pageName === 'cart') {
                renderCart();
            }
        }

        async function connectPi() {
            try {
                document.getElementById('connectBtn').innerText = "...";
                const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
                isAuthenticated = true;
                currentUser = auth.user.username;
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('userStatus').innerText = '✅ ' + currentUser;
                document.getElementById('userStatus').style.display = 'block';
                document.getElementById('logout-btn').style.display = 'inline-block';
                document.getElementById('profile-username').innerText = currentUser;
                await loadCartFromCloud();
            } catch (err) {
                document.getElementById('connectBtn').innerText = dict[currentLang].connect;
                alert("连接失败: " + (err.message || err));
            }
        }

        function logout() {
            isAuthenticated = false;
            currentUser = null;
            cart = [];
            document.getElementById('connectBtn').style.display = 'block';
            document.getElementById('connectBtn').innerText = dict[currentLang].connect;
            document.getElementById('userStatus').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'none';
            document.getElementById('profile-username').innerText = dict[currentLang].not_connected;
            renderCart();
            switchPage('home');
        }

        function onIncompletePaymentFound(payment) { console.log("未完成支付:", payment); }

        window.addEventListener('load', () => { 
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').then(() => console.log("Service Worker Registered"));
            }
            currentLang = detectLanguage();
            changeLanguage(currentLang);
            fetchProducts(); 
        });
    </script>
</body>
</html>
