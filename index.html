<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DZPJ Trade</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8f9fa; color: #333; padding-bottom: 60px; }
        header { background: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #eee; }
        .logo { font-size: 18px; font-weight: 700; color: #1a1a1a; }
        .logo span { color: #d32f2f; }
        .lang-selector { background: #eee; border: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; margin-left: 10px; }
        #connectBtn { background-color: #d32f2f; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
        #userStatus { font-size: 14px; color: #2e7d32; font-weight: 600; display: none; }
        
        .page { display: none; padding: 16px; max-width: 480px; margin: 0 auto; }
        .page.active { display: block; }
        
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; }
        .filter-tab { background: #fff; padding: 6px 16px; border-radius: 16px; font-size: 13px; color: #666; border: 1px solid #eee; cursor: pointer; white-space: nowrap; }
        .filter-tab.active { background: #d32f2f; color: #fff; border-color: #d32f2f; }
        
        .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); display: flex; gap: 12px; cursor: pointer; align-items: center; }
        .card-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
        .card-info { flex: 1; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .card-price { color: #d32f2f; font-size: 16px; font-weight: 700; margin-top: 6px; }
        .badge-group { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px;}
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .badge-sgs { background-color: #e3f2fd; color: #1565c0; }
        .badge-halal { background-color: #e8f5e9; color: #2e7d32; }

        .back-btn { display: inline-block; margin-bottom: 16px; padding: 8px 12px; background: #fff; border-radius: 8px; border: 1px solid #eee; cursor: pointer; }
        .detail-img { width: 100%; height: 250px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; }
        .detail-box { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #f0f0f0; }
        .detail-box h3 { font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .detail-desc { font-size: 13px; color: #555; line-height: 1.6; margin-top: 10px; background: #fafafa; padding: 10px; border-radius: 8px; }
        
        .pay-btn { background-color: #d32f2f; color: #fff; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .pay-btn:disabled { background-color: #ccc; }

        /* 购物车列表 */
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
        .cart-item-info { flex: 1; }
        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 26px; height: 26px; background: #eee; border: none; border-radius: 50%; font-size: 16px; cursor: pointer; }
        
        .profile-header { background: #d32f2f; border-radius: 12px; padding: 24px; text-align: center; color: white; margin-bottom: 20px; }
        .address-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-top: 8px; font-size: 14px; }
        .order-card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #eee; }
        .order-title { font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; }
        .order-tx { font-size: 12px; color: #888; margin-top: 6px; word-break: break-all; }
        .order-status { display: inline-block; background: #fff3e0; color: #e65100; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-top: 6px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #eee; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 12px; color: #999; cursor: pointer; }
        .nav-item.active { color: #d32f2f; font-weight: 600; }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center;">
            <div class="logo">DZPJ <span>RWA</span></div>
            <select class="lang-selector" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
        </div>
        <div id="userStatus"></div>
        <button id="connectBtn" onclick="connectPi()" data-i18n="connect">Connect Wallet</button>
    </header>

    <!-- 首页 -->
    <div id="page-home" class="page active">
        <div class="filter-tabs">
            <div class="filter-tab active" onclick="filterCategory('all', this)" data-i18n="all">全部</div>
            <div class="filter-tab" onclick="filterCategory('spice', this)" data-i18n="spices">香料</div>
            <div class="filter-tab" onclick="filterCategory('halal', this)" data-i18n="halal">清真食品</div>
        </div>
        <div id="product-list"></div>
    </div>

    <!-- 详情页 -->
    <div id="page-detail" class="page">
        <div class="back-btn" onclick="switchPage('home')" data-i18n="back">← 返回</div>
        <div id="detail-content"></div>
    </div>

    <!-- 购物车页 -->
    <div id="page-cart" class="page">
        <h2 style="font-size: 20px; margin-bottom: 16px;" data-i18n="cart">购物车</h2>
        <div id="cart-list"></div>
        <div id="cart-summary" style="display: none; background: #fff; padding: 16px; border-radius: 12px; margin-top: 16px;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 16px;">
                <span data-i18n="total">总计:</span>
                <span style="color: #d32f2f;" id="cart-total-price">0</span>
            </div>
            <button class="pay-btn" onclick="checkoutCart()" data-i18n="checkout">去结算</button>
        </div>
    </div>

    <!-- 我的页面 -->
    <div id="page-profile" class="page">
        <div class="profile-header">
            <div style="font-size: 40px; margin-bottom: 10px;">👤</div>
            <h2 id="profile-username" style="font-size: 18px;" data-i18n="not_connected">未连接钱包</h2>
        </div>
        
        <div class="detail-box">
            <h3 data-i18n="address_title">收货地址管理</h3>
            <input type="text" class="address-input" id="user-address" placeholder="请输入详细收货地址" onchange="saveAddress(this.value)">
        </div>

        <div class="detail-box">
            <h3 data-i18n="orders_title">我的订单</h3>
            <div id="order-list"></div>
        </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchPage('home')">
            <span class="nav-icon">🏠</span><span data-i18n="home">首页</span>
        </div>
        <div class="nav-item" id="nav-cart" onclick="switchPage('cart')">
            <span class="nav-icon">🛒</span><span data-i18n="cart">购物车</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchPage('profile')">
            <span class="nav-icon">👤</span><span data-i18n="profile">我的</span>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://sqxeyzzoxwytecqktaqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_72-nfp11uFWf5kv6_qKViA_jp_OZA5S'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        Pi.init({ version: "2.0", sandbox: true });
        let isAuthenticated = false;
        let currentUser = null;
        let allProducts = [];
        let currentLang = 'zh';
        
        // 购物车状态，从本地读取
        let cart = JSON.parse(localStorage.getItem('dzpj_cart')) || [];
        // 地址状态
        let userAddress = localStorage.getItem('dzpj_address') || '';

        const dict = {
            zh: { connect: "连接钱包", all: "全部", spices: "香料", halal: "清真食品", loading: "加载中...", back: "← 返回", not_connected: "未连接钱包", home: "首页", cart: "购物车", profile: "我的", orders_title: "我的订单", address_title: "收货地址管理", total: "总计", checkout: "去结算", add_cart: "加入购物车", no_orders: "暂无订单记录", empty_cart: "购物车空空如也", pay: "支付", origin: "产地", effect_med: "中药功效", effect_season: "调味/食用特点", craft: "制作工艺", history: "历史由来" },
            en: { connect: "Connect Wallet", all: "All", spices: "Spices", halal: "Halal Food", loading: "Loading...", back: "← Back", not_connected: "Not Connected", home: "Home", cart: "Cart", profile: "Profile", orders_title: "My Orders", address_title: "Address", total: "Total", checkout: "Checkout", add_cart: "Add to Cart", no_orders: "No orders", empty_cart: "Cart is empty", pay: "Pay", origin: "Origin", effect_med: "TCM Effect", effect_season: "Culinary Feature", craft: "Craftsmanship", history: "History" },
            ar: { connect: "ربط المحفظة", all: "الكل", spices: "التوابل", halal: "طعام حلال", loading: "جاري التحميل...", back: "← رجوع", not_connected: "غير متصل", home: "الرئيسية", cart: "عربة التسوق", profile: "حسابي", orders_title: "طلباتي", address_title: "إدارة العنوان", total: "الإجمالي", checkout: "الدفع", add_cart: "أضف إلى السلة", no_orders: "لا توجد طلبات", empty_cart: "السلة فارغة", pay: "دفع", origin: "المنشأ", effect_med: "تأثير طبي", effect_season: "ميزة الطهي", craft: "الحرفية", history: "التاريخ" }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(dict[lang][key]) el.innerText = dict[lang][key];
            });
            renderProducts('all');
            renderCart();
        }

        function getUnit(category) {
            if(currentLang === 'zh') return category === 'spice' ? '公斤' : '盒';
            if(currentLang === 'ar') return category === 'spice' ? 'كغ' : 'صندوق';
            return category === 'spice' ? 'kg' : 'box';
        }

        function getTrans(p, field) {
            const langField = `${field}_${currentLang}`;
            if (currentLang === 'zh') return p[field] || '';
            return p[langField] || p[field] || ''; 
        }

        function getProductName(p) { return getTrans(p, 'name'); }

        // --- 数据获取与渲染 ---
        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
            if (!error) { allProducts = data; renderProducts('all'); }
        }

        function renderProducts(filter) {
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = '';
            let filtered = filter === 'all' ? allProducts : allProducts.filter(p => p.category === filter);
            
            filtered.forEach(p => {
                listEl.innerHTML += `
                    <div class="card" onclick="showDetail(${p.id})">
                        <img src="${p.image_url}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1596797038530-2c107229654b?w=400'">
                        <div class="card-info">
                            <div class="card-title">${getProductName(p)}</div>
                            <div class="card-price">${p.price} Pi / ${getUnit(p.category)}</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(category, el) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderProducts(category);
        }

        function showDetail(id) {
            const p = allProducts.find(item => item.id === id);
            const detailEl = document.getElementById('detail-content');
            const unit = getUnit(p.category);
            const dictLang = dict[currentLang];
            
            const medText = getTrans(p, 'effect_med');
            const seasonText = getTrans(p, 'effect_season');
            const craftText = getTrans(p, 'craft');
            const historyText = getTrans(p, 'history');
            const originText = getTrans(p, 'origin');

            let detailHtml = '';
            if (originText || medText || seasonText || craftText || historyText) {
                detailHtml = `
                    <div class="detail-box">
                        <h3>${dictLang.origin}: ${originText || 'China'}</h3>
                        ${medText ? `<div class="detail-desc"><b>${dictLang.effect_med}:</b> ${medText}</div>` : ''}
                        ${seasonText ? `<div class="detail-desc"><b>${dictLang.effect_season}:</b> ${seasonText}</div>` : ''}
                        ${craftText ? `<div class="detail-desc"><b>${dictLang.craft}:</b> ${craftText}</div>` : ''}
                        ${historyText ? `<div class="detail-desc"><b>${dictLang.history}:</b> ${historyText}</div>` : ''}
                    </div>
                `;
            }

            detailEl.innerHTML = `
                <img src="${p.image_url}" class="detail-img" onerror="this.src='https://images.unsplash.com/photo-1596797038530-2c107229654b?w=400'">
                <h2 style="font-size: 22px; margin-bottom: 8px;">${getProductName(p)}</h2>
                <div style="color: #d32f2f; font-size: 24px; font-weight: bold; margin-bottom: 16px;">${p.price} Pi / ${unit}</div>
                ${detailHtml}
                <button class="pay-btn" onclick="addToCart(${p.id})" data-i18n="add_cart">加入购物车</button>
            `;
            switchPage('detail');
        }

        // --- 购物车逻辑 ---
        function addToCart(id) {
            const p = allProducts.find(item => item.id === id);
            const existing = cart.find(item => item.id === id);
            if(existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: p.id, name: getProductName(p), price: p.price, qty: 1, category: p.category });
            }
            saveCart();
            alert(dict[currentLang].add_cart + " Success!");
        }

        function saveCart() {
            localStorage.setItem('dzpj_cart', JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            const listEl = document.getElementById('cart-list');
            const summaryEl = document.getElementById('cart-summary');
            const totalEl = document.getElementById('cart-total-price');
            
            if(cart.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:#999; margin-top:20px;">${dict[currentLang].empty_cart}</p>`;
                summaryEl.style.display = 'none';
                return;
            }
            
            listEl.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                listEl.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div style="font-weight:bold;">${item.name}</div>
                            <div style="color:#d32f2f; font-size:14px; margin-top:4px;">${item.price} Pi / ${getUnit(item.category)}</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            totalEl.innerText = total.toFixed(1) + " Pi";
            summaryEl.style.display = 'block';
        }

        function updateQty(index, change) {
            cart[index].qty += change;
            if(cart[index].qty <= 0) cart.splice(index, 1);
            saveCart();
        }

        // --- 结算逻辑 ---
        async function checkoutCart() {
            if (!isAuthenticated) { alert("请先连接钱包"); return; }
            if (!userAddress) { alert("请先去【我的】页面填写收货地址"); switchPage('profile'); return; }
            if (cart.length === 0) return;

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const itemNames = cart.map(i => `${i.name}x${i.qty}`).join(', ');

            try {
                await Pi.createPayment({
                    amount: totalAmount,
                    memo: "购物车结算: " + itemNames,
                    metadata: { items: cart, address: userAddress }
                }, {
                    onReadyForServerApproval: async (paymentId) => {
                        await fetch('/api/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId }) });
                    },
                    onReadyForServerCompletion: async function(paymentId, txid) {
                        const res = await fetch('/api/complete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId, txid }) });
                        if (res.ok) {
                            // 写入数据库，这里为了简单，把购物车所有商品拼成一条订单记录存入
                            await supabaseClient.from('orders').insert([{ 
                                username: currentUser, 
                                item_name: itemNames, 
                                amount: totalAmount, 
                                txid: txid,
                                address: userAddress,
                                status: '待发货'
                            }]);
                            alert(`支付成功！已生成订单。`);
                            cart = [];
                            saveCart();
                            switchPage('home');
                        } else {
                            alert("防刷单校验失败！");
                        }
                    },
                    onCancel: function() { alert("支付取消"); },
                    onError: function(error) { alert("支付错误"); }
                });
            } catch (error) { alert("创建支付失败"); }
        }

        // --- 地址与我的 ---
        function saveAddress(val) {
            userAddress = val;
            localStorage.setItem('dzpj_address', val);
        }

        async function fetchOrders() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient.from('orders').select('*').eq('username', currentUser).order('created_at', { ascending: false });
            const listEl = document.getElementById('order-list');
            if (error || data.length === 0) {
                listEl.innerHTML = `<p style="font-size: 13px; color: #999; text-align: center;">${dict[currentLang].no_orders}</p>`;
                return;
            }
            listEl.innerHTML = '';
            data.forEach(order => {
                listEl.innerHTML += `
                    <div class="order-card">
                        <div class="order-title">
                            <span>${order.item_name}</span>
                            <span style="color:#d32f2f;">${order.amount} Pi</span>
                        </div>
                        <div class="order-tx">地址: ${order.address || '未填写'}</div>
                        <div class="order-tx">TxID: ${order.txid}</div>
                        <div class="order-status">${order.status || '待发货'}</div>
                    </div>
                `;
            });
        }

        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageName}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`nav-${pageName}`).classList.add('active');
            
            if(pageName === 'profile') {
                document.getElementById('user-address').value = userAddress;
                fetchOrders(); 
            } else if(pageName === 'cart') {
                renderCart();
            }
        }

        async function connectPi() {
            try {
                document.getElementById('connectBtn').innerText = "...";
                const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
                isAuthenticated = true;
                currentUser = auth.user.username;
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('userStatus').innerText = '✅ ' + currentUser;
                document.getElementById('userStatus').style.display = 'block';
                document.getElementById('profile-username').innerText = currentUser;
            } catch (err) {
                document.getElementById('connectBtn').innerText = dict[currentLang].connect;
                alert("连接失败: " + (err.message || err));
            }
        }

        function onIncompletePaymentFound(payment) { console.log("未完成支付:", payment); }

        window.addEventListener('load', () => { fetchProducts(); renderCart(); });
    </script>
</body>
</html>
