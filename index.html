<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DZPJ Trade</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8f9fa; color: #333; padding-bottom: 60px; }
        
        /* 顶部导航 */
        header { background: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #eee; }
        .logo { font-size: 18px; font-weight: 700; color: #1a1a1a; }
        .logo span { color: #d32f2f; }
        #connectBtn { background-color: #d32f2f; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
        #userStatus { font-size: 14px; color: #2e7d32; font-weight: 600; display: none; }

        /* 页面容器 */
        .page { display: none; padding: 16px; max-width: 480px; margin: 0 auto; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* 搜索框 & 分类 */
        .search-bar { background: #fff; border-radius: 20px; padding: 10px 16px; display: flex; align-items: center; border: 1px solid #eee; margin-bottom: 16px; }
        .search-bar input { border: none; outline: none; flex: 1; font-size: 14px; }
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .filter-tab { background: #fff; padding: 6px 16px; border-radius: 16px; font-size: 13px; color: #666; white-space: nowrap; border: 1px solid #eee; cursor: pointer; }
        .filter-tab.active { background: #d32f2f; color: #fff; border-color: #d32f2f; }

        /* 商品卡片 */
        .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); border: 1px solid #f0f0f0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .card-header { display: flex; align-items: center; margin-bottom: 6px; }
        .card-icon { font-size: 20px; margin-right: 8px; }
        .card-title { font-size: 16px; font-weight: 700; }
        .card-price { color: #d32f2f; font-size: 16px; font-weight: 700; margin-top: 8px; }
        .card-right { font-size: 24px; color: #ccc; font-weight: bold; padding-left: 10px; }
        .badge-group { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px;}
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
        .badge-sgs { background-color: #e3f2fd; color: #1565c0; }
        .badge-halal { background-color: #e8f5e9; color: #2e7d32; }
        .badge-chain { background-color: #f3e5f5; color: #6a1b9a; }

        /* 详情页 */
        .back-btn { display: inline-block; margin-bottom: 16px; font-size: 14px; color: #666; cursor: pointer; background: #fff; padding: 8px 12px; border-radius: 8px; border: 1px solid #eee; }
        .detail-image { font-size: 80px; text-align: center; padding: 20px; background: #fff; border-radius: 12px; margin-bottom: 16px; }
        .detail-box { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #f0f0f0; }
        .detail-box h3 { font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 14px; color: #666; margin-bottom: 8px; }
        .pay-btn { background-color: #d32f2f; color: #fff; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .pay-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        /* 我的页面专用样式 */
        .profile-header { background: linear-gradient(135deg, #d32f2f, #ff5252); border-radius: 12px; padding: 24px; text-align: center; color: white; margin-bottom: 20px; }
        .profile-avatar { font-size: 50px; margin-bottom: 10px; }
        .menu-list { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #eee; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #f5f5f5; font-size: 15px; cursor: pointer; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item-left { display: flex; align-items: center; gap: 10px; }
        .menu-icon { font-size: 20px; }
        .menu-value { color: #999; font-size: 14px; }

        /* 底部导航 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #eee; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 12px; color: #999; cursor: pointer; }
        .nav-item.active { color: #d32f2f; font-weight: 600; }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 4px; }

        /* 多语言切换弹窗 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: flex-end; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 20px; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .lang-option { padding: 14px; text-align: center; border-bottom: 1px solid #eee; cursor: pointer; font-size: 16px; }
        .lang-option:hover { background: #f5f5f5; }
    </style>
</head>
<body>

    <header>
        <div class="logo">DZPJ <span>RWA</span></div>
        <div id="userStatus"></div>
        <button id="connectBtn" onclick="connectPi()" data-i18n="connect">Connect Wallet</button>
    </header>

    <!-- 首页 -->
    <div id="page-home" class="page active">
        <div class="search-bar">
            <span style="margin-right: 8px; color: #999;">🔍</span>
            <input type="text" id="search-input" placeholder="搜索仓单 / SGS编号 / 认证..." data-i18n-placeholder="search_placeholder">
        </div>

        <div class="filter-tabs">
            <div class="filter-tab active" onclick="filterCategory('all', this)" data-i18n="all">全部</div>
            <div class="filter-tab" onclick="filterCategory('spice', this)" data-i18n="spices">香料</div>
            <div class="filter-tab" onclick="filterCategory('halal', this)" data-i18n="halal">清真食品</div>
            <div class="filter-tab" onclick="filterCategory('sgs', this)" data-i18n="sgs">SGS认证</div>
        </div>

        <div id="product-list"></div>
    </div>

    <!-- 详情页 -->
    <div id="page-detail" class="page">
        <div class="back-btn" onclick="switchPage('home')" data-i18n="back">← 返回</div>
        <div id="detail-content"></div>
    </div>

    <!-- 我的页面 -->
    <div id="page-profile" class="page">
        <div class="profile-header">
            <div class="profile-avatar">👤</div>
            <h2 id="profile-username" style="font-size: 20px; margin-bottom: 5px;" data-i18n="not_connected">未连接钱包</h2>
            <p style="font-size: 13px; opacity: 0.8;" data-i18n="connect_hint">请点击右上角连接钱包</p>
        </div>

        <div class="menu-list">
            <div class="menu-item" onclick="alert('Pi Network KYC 已通过')">
                <div class="menu-item-left">
                    <span class="menu-icon">🪪</span>
                    <span data-i18n="identity">身份证明</span>
                </div>
                <div class="menu-value" style="color: #2e7d32;" data-i18n="verified">已认证</div>
            </div>
            
            <div class="menu-item" onclick="alert('暂无交易记录')">
                <div class="menu-item-left">
                    <span class="menu-icon">📜</span>
                    <span data-i18n="history">消费记录</span>
                </div>
                <div class="menu-value">›</div>
            </div>
            
            <div class="menu-item" onclick="prompt('请输入您的收货地址：', '中国山东省德州市')">
                <div class="menu-item-left">
                    <span class="menu-icon">📍</span>
                    <span data-i18n="address">收货地址</span>
                </div>
                <div class="menu-value" id="address-display">未设置</div>
            </div>
            
            <div class="menu-item" onclick="openLanguageModal()">
                <div class="menu-item-left">
                    <span class="menu-icon">🌐</span>
                    <span data-i18n="language">语言设置</span>
                </div>
                <div class="menu-value" id="current-lang-display">English</div>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchPage('home')">
            <span class="nav-icon">🏠</span><span data-i18n="home">首页</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchPage('profile')">

        </div>
    </nav>

            <div class="lang-option" onclick="changeLanguage('zh')">简体中文</div>
            <div class="lang-option" onclick="changeLanguage('tw')">繁體中文</div>
            <div class="lang-option" onclick="changeLanguage('ar')">العربية (阿拉伯语)</div>

            currentLang = lang;

            document.querySelectorAll('[data-i18n]').forEach(el => {

            { id: 36, name: '黑巧克力', category: 'halal', icon: '🍫', price: 1.5, halal: 'HL-2026-103', stock: 180, desc: '规格：75%纯黑巧' },
            { id: 37, name: '锡兰红茶', category: 'halal', icon: '🍵', price: 1.0, halal: 'HL-2026-104', stock: 260, desc: '规格：斯里兰卡原装' },
            { id: 38, name: '咸味奶茶粉', category: 'halal', icon: '🥛', price: 0.8, halal: 'HL-2026-105', stock: 210, desc: '规格：内蒙风味' },
            { id: 39, name: '清真酱油', category: 'halal', icon: '🧂', price: 0.3, halal: 'HL-2026-106', stock: 450, desc: '规格：纯粮酿造' },
            { id: 40, name: '清真香醋', category: 'halal', icon: '🍶', price: 0.4, halal: 'HL-2026-107', stock: 420, desc: '规格：山西老陈醋' },
            { id: 41, name: '火锅底料', category: 'halal', icon: '🌶️', price: 1.6, halal: 'HL-2026-108', stock: 150, desc: '规格：清真牛油麻辣' },
            { id: 42, name: '清真肉肠', category: 'halal', icon: '🌭', price: 1.2, sgs: 'SGS-24-095', halal: 'HL-2026-109', stock: 190, desc: '规格：黑椒牛肉烤肠' },
            { id: 43, name: '清真水饺', category: 'halal', icon: '🥟', price: 1.9, sgs: 'SGS-24-096', halal: 'HL-2026-110', stock: 130, desc: '规格：羊肉大葱手工' },
            { id: 44, name: '自热火锅', category: 'halal', icon: '🥘', price: 2.8, halal: 'HL-2026-111', stock: 60, desc: '规格：牛油素食自热' },
            { id: 45, name: '清真燕麦', category: 'halal', icon: '🥣', price: 0.9, halal: 'HL-2026-112', stock: 310, desc: '规格：澳洲进口全谷' }
        ];

        // ============================================
        // 3. Pi SDK 初始化与渲染逻辑
        // ============================================
        Pi.init({ version: "2.0", sandbox: true });
        let isAuthenticated = false;
        let currentUser = null;

        function renderProducts(filter = 'all') {
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = '';
            
            let filtered = products;
            if (filter === 'spice' || filter === 'halal') {
                filtered = products.filter(p => p.category === filter);
            } else if (filter === 'sgs') {
                filtered = products.filter(p => p.sgs != null);
            }
            
            filtered.forEach(p => {
                // 动态获取多语言标签（保持简洁，这里直接写死中文/英文切换的示例）
                const tagSgs = currentLang === 'en' ? 'SGS' : 'SGS认证';
                const tagHalal = currentLang === 'en' ? 'Halal' : 'Halal认证';
                const tagChain = currentLang === 'en' ? 'On-chain' : '链上溯源';

                const badgeHtml = `
                    <div class="badge-group">
                        ${p.sgs ? `<span class="badge badge-sgs">${tagSgs}</span>` : ''}
                        ${p.halal ? `<span class="badge badge-halal">${tagHalal}</span>` : ''}
                        <span class="badge badge-chain">${tagChain}</span>
                    </div>
                `;
                listEl.innerHTML += `
                    <div class="card" onclick="showDetail(${p.id})">
                        <div class="card-left">
                            <div class="card-header">
                                <div class="card-icon">${p.icon}</div>
                                <div class="card-title">${p.name}</div>
                            </div>
                            ${badgeHtml}
                            <div class="card-price">${p.price} Pi / 吨</div>
                        </div>
                        <div class="card-right">›</div>
                    </div>
                `;
            });
        }

        function filterCategory(category, el) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderProducts(category);
        }

        function showDetail(id) {
            const p = products.find(item => item.id === id);
            const detailEl = document.getElementById('detail-content');
            const mockHash = '0x' + Math.random().toString(16).substr(2, 10) + '...' + Math.random().toString(16).substr(2, 6);
            
            const dict = translations[currentLang];
            const btnText = isAuthenticated ? `${dict.pay} ${p.price} Pi ${dict.buy}` : dict.connect;
            
            detailEl.innerHTML = `
                <div class="detail-image">${p.icon}</div>
                <h2 style="font-size: 22px; margin-bottom: 8px;">${p.name}</h2>
                <div style="color: #d32f2f; font-size: 24px; font-weight: bold; margin-bottom: 16px;">${p.price} Pi / 吨</div>
                
                <div class="detail-box">
                    <h3>${currentLang === 'en' ? 'Basic Info' : '基础信息'}</h3>
                    <div class="detail-row"><span>${currentLang === 'en' ? 'Specs' : '规格描述'}</span><span style="text-align:right; max-width:60%;">${p.desc}</span></div>
                    <div class="detail-row"><span>${currentLang === 'en' ? 'Stock' : '当前库存'}</span><span>${p.stock} 吨</span></div>
                </div>

                <div class="detail-box">
                    <h3>${currentLang === 'en' ? 'Traceability & Compliance' : '链上溯源与合规'}</h3>
                    ${p.sgs ? `<div class="detail-row"><span>SGS Cert</span><span style="color:#1565c0">${p.sgs}</span></div>` : ''}
                    ${p.halal ? `<div class="detail-row"><span>Halal Cert</span><span style="color:#2e7d32">${p.halal}</span></div>` : ''}
                    <div class="detail-row"><span>Hash</span><span style="color:#6a1b9a">${mockHash}</span></div>
                </div>

                <div class="detail-box">
                    <h3>Murabaha</h3>
                    <p style="font-size: 13px; color: #666; line-height: 1.6;">
                        ${currentLang === 'en' ? 'This transaction complies with Islamic finance principles (no Riba). The smart contract transfers the warehouse receipt upon payment.' : '本交易符合伊斯兰金融原则，无利息 (Riba)。买方按此固定总价进行支付，链上智能合约将在确认款项后自动转移对应仓单所有权。'}
                    </p>
                </div>

                <button class="pay-btn" id="detail-pay-btn" data-amount="${p.price}" onclick="payPi(${p.price}, '${p.name}')" ${isAuthenticated ? '' : 'disabled'}>
                    ${btnText}
                </button>
            `;
            switchPage('detail');
        }

        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageName}`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(pageName === 'home' || pageName === 'detail') {
                document.getElementById('nav-home').classList.add('active');
            } else {
                document.getElementById(`nav-${pageName}`).classList.add('active');
            }
        }

        // ============================================
        // 4. 钱包与支付逻辑
        // ============================================
        async function connectPi() {
            try {
                document.getElementById('connectBtn').innerText = "...";
                const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
                isAuthenticated = true;
                currentUser = auth.user.username;

                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('userStatus').innerText = '✅ ' + currentUser;
                document.getElementById('userStatus').style.display = 'block';
                document.getElementById('profile-username').innerText = currentUser;

                const payBtn = document.getElementById('detail-pay-btn');
                if(payBtn) {
                    payBtn.disabled = false;
                    const amount = payBtn.getAttribute('data-amount');
                    const dict = translations[currentLang];
                    payBtn.innerText = `${dict.pay} ${amount} Pi ${dict.buy}`;
                }
            } catch (err) {
                document.getElementById('connectBtn').innerText = translations[currentLang].connect;
                alert("连接失败: " + err.message);
            }
        }

        function onIncompletePaymentFound(payment) {
            console.log("发现未完成的支付:", payment);
        }

        async function payPi(amount, itemName) {
            if (!isAuthenticated) return;
            const payBtn = document.getElementById('detail-pay-btn');
            payBtn.innerText = "...";
            payBtn.disabled = true;

            try {
                await Pi.createPayment({
                    amount: amount,
                    memo: "购买 " + itemName + " - 金额: " + amount + " Pi",
                    metadata: { item: itemName, amount: amount }
                }, {
                    onReadyForServerApproval: async (paymentId) => {
                        try {
                            const res = await fetch('/api/approve', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ paymentId })
                            });
                            if (!res.ok) throw new Error('后端批准失败');
                        } catch (err) {
                            payBtn.innerText = "重试";
                            payBtn.disabled = false;
                            alert("批准失败: " + err.message);
                        }
                    },
                    onReadyForServerCompletion: async function(paymentId, txid) {
                        try {
                            const res = await fetch('/api/complete', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ paymentId, txid })
                            });
                            if (!res.ok) throw new Error('后端确认失败');
                            alert(`${itemName} 支付成功！`);
                            payBtn.innerText = "已完成";
                        } catch (err) {
                            alert("确认失败: " + err.message);
                            payBtn.innerText = "重试";
                            payBtn.disabled = false;
                        }
                    },
                    onCancel: function() {
                        const dict = translations[currentLang];
                        payBtn.innerText = `${dict.pay} ${amount} Pi ${dict.buy}`;
                        payBtn.disabled = false;
                    },
                    onError: function(error) {
                        alert("支付错误: " + error.message);
                        payBtn.disabled = false;
                    }
                });
            } catch (error) {
                alert("创建支付失败: " + error.message);
                payBtn.disabled = false;
            }
        }

        window.addEventListener('load', () => {
            renderProducts();
            // 初始化多语言
            changeLanguage('en'); 
        });
    </script>
</body>
</html>
