<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DZPJ Trade</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8f9fa; color: #333; padding-bottom: 60px; }
        header { background: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #eee; }
        .logo { font-size: 18px; font-weight: 700; color: #1a1a1a; }
        .logo span { color: #d32f2f; }
        #connectBtn { background-color: #d32f2f; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
        #userStatus { font-size: 14px; color: #2e7d32; font-weight: 600; display: none; }
        .page { display: none; padding: 16px; max-width: 480px; margin: 0 auto; }
        .page.active { display: block; }
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; }
        .filter-tab { background: #fff; padding: 6px 16px; border-radius: 16px; font-size: 13px; color: #666; border: 1px solid #eee; cursor: pointer; }
        .filter-tab.active { background: #d32f2f; color: #fff; border-color: #d32f2f; }
        
        .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); display: flex; gap: 12px; cursor: pointer; align-items: center; }
        .card-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; background: #eee; }
        .card-info { flex: 1; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .card-price { color: #d32f2f; font-size: 16px; font-weight: 700; margin-top: 6px; }
        .badge-group { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px;}
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .badge-sgs { background-color: #e3f2fd; color: #1565c0; }
        .badge-halal { background-color: #e8f5e9; color: #2e7d32; }

        .back-btn { display: inline-block; margin-bottom: 16px; padding: 8px 12px; background: #fff; border-radius: 8px; border: 1px solid #eee; cursor: pointer; }
        .detail-img { width: 100%; height: 250px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; }
        .detail-box { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #f0f0f0; }
        .detail-box h3 { font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 14px; color: #666; margin-bottom: 8px; }
        .pay-btn { background-color: #d32f2f; color: #fff; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .pay-btn:disabled { background-color: #ccc; }

        .profile-header { background: #d32f2f; border-radius: 12px; padding: 24px; text-align: center; color: white; margin-bottom: 20px; }
        .order-card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #eee; }
        .order-title { font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; }
        .order-tx { font-size: 12px; color: #888; margin-top: 6px; word-break: break-all; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #eee; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 12px; color: #999; cursor: pointer; }
        .nav-item.active { color: #d32f2f; font-weight: 600; }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">DZPJ <span>RWA</span></div>
        <div id="userStatus"></div>
        <button id="connectBtn" onclick="connectPi()">Connect Wallet</button>
    </header>

    <div id="page-home" class="page active">
        <div class="filter-tabs">
            <div class="filter-tab active" onclick="filterCategory('all', this)">全部</div>
            <div class="filter-tab" onclick="filterCategory('spice', this)">香料</div>
            <div class="filter-tab" onclick="filterCategory('halal', this)">清真食品</div>
        </div>
        <div id="product-list"><p style="text-align:center; color:#999;">加载商品中...</p></div>
    </div>

    <div id="page-detail" class="page">
        <div class="back-btn" onclick="switchPage('home')">← 返回</div>
        <div id="detail-content"></div>
    </div>

    <div id="page-profile" class="page">
        <div class="profile-header">
            <div style="font-size: 40px; margin-bottom: 10px;">👤</div>
            <h2 id="profile-username" style="font-size: 18px;">未连接钱包</h2>
        </div>
        
        <div class="detail-box">
            <h3>信任背书与合规</h3>
            <div class="detail-row"><span>📜 平台资质</span><span>已通过 KYB 认证 (演示)</span></div>
            <div class="detail-row"><span>⚖️ 交易合规</span><span>Murabaha 伊斯兰金融原则</span></div>
            <div class="detail-row"><span>🔒 资产托管</span><span>第三方监管仓储证明</span></div>
        </div>

        <div class="detail-box">
            <h3>我的订单</h3>
            <div id="order-list"><p style="font-size: 13px; color: #999; text-align: center;">加载中...</p></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchPage('home')">
            <span class="nav-icon">🏠</span>首页
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchPage('profile')">
            <span class="nav-icon">👤</span>我的
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://sqxeyzzoxwytecqktaqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_72-nfp11uFWf5kv6_qKViA_jp_OZA5S'; // 如果你换了新的 key，请替换这里
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        Pi.init({ version: "2.0", sandbox: true });
        let isAuthenticated = false;
        let currentUser = null;
        let allProducts = [];

        // 动态判断单位
        function getUnit(category) {
            return category === 'spice' ? '公斤' : '盒';
        }

        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
            if (error) {
                console.error("加载商品失败", error);
                document.getElementById('product-list').innerHTML = '<p style="text-align:center; color:red;">数据库连接失败</p>';
                return;
            }
            allProducts = data;
            renderProducts('all');
        }

        function renderProducts(filter) {
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = '';
            
            let filtered = allProducts;
            if (filter !== 'all') {
                filtered = allProducts.filter(p => p.category === filter);
            }
            
            filtered.forEach(p => {
                listEl.innerHTML += `
                    <div class="card" onclick="showDetail(${p.id})">
                        <img src="${p.image_url}" class="card-img" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1596797038530-2c107229654b?w=400'">
                        <div class="card-info">
                            <div class="card-title">${p.name}</div>
                            <div class="badge-group">
                                ${p.sgs ? `<span class="badge badge-sgs">SGS认证</span>` : ''}
                                ${p.halal ? `<span class="badge badge-halal">Halal认证</span>` : ''}
                            </div>
                            <div class="card-price">${p.price} Pi / ${getUnit(p.category)}</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(category, el) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderProducts(category);
        }

        function showDetail(id) {
            const p = allProducts.find(item => item.id === id);
            const detailEl = document.getElementById('detail-content');
            const profit = (p.price - p.cost).toFixed(2);
            const unit = getUnit(p.category);
            const mockHash = '0x' + Math.random().toString(16).substr(2, 10) + '...';
            
            detailEl.innerHTML = `
                <img src="${p.image_url}" class="detail-img" onerror="this.src='https://images.unsplash.com/photo-1596797038530-2c107229654b?w=400'">
                <h2 style="font-size: 22px; margin-bottom: 8px;">${p.name}</h2>
                <div style="color: #d32f2f; font-size: 24px; font-weight: bold; margin-bottom: 16px;">${p.price} Pi / ${unit}</div>
                
                <div class="detail-box">
                    <h3>Murabaha (成本加利润) 明细</h3>
                    <div class="detail-row"><span>卖家原始采购成本</span><span>${p.cost} Pi</span></div>
                    <div class="detail-row"><span>卖家合理利润加价</span><span>${profit} Pi</span></div>
                    <div class="detail-row" style="font-weight:bold; color:#d32f2f;"><span>买方最终支付总额</span><span>${p.price} Pi</span></div>
                </div>

                <div class="detail-box">
                    <h3>基础信息与溯源</h3>
                    <div class="detail-row"><span>规格描述</span><span style="text-align:right; max-width:60%;">${p.description}</span></div>
                    <div class="detail-row"><span>当前库存</span><span>${p.stock} ${unit}</span></div>
                    ${p.sgs ? `<div class="detail-row"><span>SGS证书</span><span>${p.sgs}</span></div>` : ''}
                    ${p.halal ? `<div class="detail-row"><span>Halal证书</span><span>${p.halal}</span></div>` : ''}
                    <div class="detail-row"><span>合约存证哈希</span><span style="color:#6a1b9a">${mockHash}</span></div>
                </div>

                <button class="pay-btn" id="detail-pay-btn" onclick="payPi(${p.price}, '${p.name}')" ${isAuthenticated ? '' : 'disabled'}>
                    ${isAuthenticated ? `支付 ${p.price} Pi 购买` : '请先连接钱包'}
                </button>
            `;
            switchPage('detail');
        }

        async function fetchOrders() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient.from('orders').select('*').eq('username', currentUser).order('created_at', { ascending: false });

            const listEl = document.getElementById('order-list');
            if (error || data.length === 0) {
                listEl.innerHTML = '<p style="font-size: 13px; color: #999; text-align: center;">暂无订单记录</p>';
                return;
            }

            listEl.innerHTML = '';
            data.forEach(order => {
                listEl.innerHTML += `
                    <div class="order-card">
                        <div class="order-title">
                            <span>${order.item_name}</span>
                            <span style="color:#d32f2f;">${order.amount} Pi</span>
                        </div>
                        <div class="order-tx">TxID: ${order.txid}</div>
                        <div class="order-tx" style="color:#2e7d32;">状态: 已上链/待发货</div>
                    </div>
                `;
            });
        }

        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageName}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if(pageName === 'profile') {
                document.getElementById('nav-profile').classList.add('active');
                fetchOrders(); 
            } else {
                document.getElementById('nav-home').classList.add('active');
            }
        }

        async function connectPi() {
            try {
                document.getElementById('connectBtn').innerText = "连接中...";
                const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
                isAuthenticated = true;
                currentUser = auth.user.username;

                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('userStatus').innerText = '✅ ' + currentUser;
                document.getElementById('userStatus').style.display = 'block';
                document.getElementById('profile-username').innerText = currentUser;

                const payBtn = document.getElementById('detail-pay-btn');
                if(payBtn) {
                    payBtn.disabled = false;
                    payBtn.innerText = payBtn.innerText.replace('请先连接钱包', '支付');
                }
            } catch (err) {
                document.getElementById('connectBtn').innerText = "Connect Wallet";
                alert("连接失败: " + (err.message || err));
            }
        }

        function onIncompletePaymentFound(payment) { console.log("未完成支付:", payment); }

        async function payPi(amount, itemName) {
            if (!isAuthenticated) return;
            const payBtn = document.getElementById('detail-pay-btn');
            payBtn.innerText = "处理中...";
            payBtn.disabled = true;

            try {
                await Pi.createPayment({
                    amount: amount,
                    memo: "购买 " + itemName + " - 金额: " + amount + " Pi",
                    metadata: { item: itemName, amount: amount }
                }, {
                    onReadyForServerApproval: async (paymentId) => {
                        const res = await fetch('/api/approve', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ paymentId })
                        });
                        if (!res.ok) { alert("批准失败"); payBtn.disabled = false; }
                    },
                    onReadyForServerCompletion: async function(paymentId, txid) {
                        const res = await fetch('/api/complete', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ paymentId, txid })
                        });

                        if (res.ok) {
                            await supabaseClient.from('orders').insert([
                                { username: currentUser, item_name: itemName, amount: amount, txid: txid }
                            ]);
                            alert(`${itemName} 支付成功！已生成订单。`);
                            payBtn.innerText = "已完成支付";
                        } else {
                            alert("防刷单校验失败！");
                            payBtn.disabled = false;
                        }
                    },
                    onCancel: function() {
                        payBtn.innerText = `支付 ${amount} Pi 购买`;
                        payBtn.disabled = false;
                    },
                    onError: function(error) {
                        alert("支付错误: " + error.message);
                        payBtn.disabled = false;
                    }
                });
            } catch (error) {
                alert("创建支付失败: " + error.message);
                payBtn.disabled = false;
            }
        }

        window.addEventListener('load', () => { fetchProducts(); });
    </script>
</body>
</html>
