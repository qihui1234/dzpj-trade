<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DZPJ Trade</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8f9fa; color: #333; padding-bottom: 60px; }
        header { background: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #eee; }
        .logo { font-size: 18px; font-weight: 700; color: #1a1a1a; }
        .logo span { color: #d32f2f; }
        .lang-selector { background: #eee; border: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; margin-left: 10px; }
        #connectBtn { background-color: #d32f2f; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
        #userStatus { font-size: 14px; color: #2e7d32; font-weight: 600; display: none; }
        
        .page { display: none; padding: 16px; max-width: 480px; margin: 0 auto; }
        .page.active { display: block; }
        
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; }
        .filter-tab { background: #fff; padding: 6px 16px; border-radius: 16px; font-size: 13px; color: #666; border: 1px solid #eee; cursor: pointer; white-space: nowrap; }
        .filter-tab.active { background: #d32f2f; color: #fff; border-color: #d32f2f; }
        
        .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); display: flex; gap: 12px; cursor: pointer; align-items: center; }
        .card-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
        .card-info { flex: 1; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .card-price { color: #d32f2f; font-size: 16px; font-weight: 700; margin-top: 6px; }
        
        .back-btn { display: inline-block; margin-bottom: 16px; padding: 8px 12px; background: #fff; border-radius: 8px; border: 1px solid #eee; cursor: pointer; }
        .detail-img { width: 100%; height: 250px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; }
        .detail-box { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #f0f0f0; }
        .detail-box h3 { font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .detail-desc { font-size: 13px; color: #555; line-height: 1.6; margin-top: 10px; background: #fafafa; padding: 10px; border-radius: 8px; }
        
        .pay-btn { background-color: #d32f2f; color: #fff; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .pay-btn:disabled { background-color: #ccc; }

        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
        .cart-item-info { flex: 1; }
        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 26px; height: 26px; background: #eee; border: none; border-radius: 50%; font-size: 16px; cursor: pointer; }
        
        .profile-header { background: #d32f2f; border-radius: 12px; padding: 24px; text-align: center; color: white; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #d32f2f; }
        .phone-group { display: flex; gap: 10px; }
        .phone-group input:first-child { width: 80px; text-align: center; }
        .phone-group input:last-child { flex: 1; }

        .order-card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #eee; cursor: pointer; }
        .order-title { font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; }
        .order-info { font-size: 12px; color: #888; margin-top: 6px; }
        .order-status-tag { display: inline-block; background: #fff3e0; color: #e65100; padding: 4px 10px; border-radius: 20px; font-size: 12px; margin-top: 10px; font-weight: bold; border: 1px solid #ffe0b2;}

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: flex-end; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #f8f9fa; width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 24px; max-height: 85vh; overflow-y: auto; }
        
        .logistics-header { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .logistics-header h3 { font-size: 16px; margin-bottom: 10px; color: #d32f2f; }
        .logistics-row { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 6px; }
        .logistics-row span:last-child { font-weight: 500; color: #333; }

        .timeline { border-left: 2px solid #e0e0e0; margin-left: 10px; padding-left: 20px; background: #fff; padding: 20px; border-radius: 12px; }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-dot { position: absolute; left: -27px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #e0e0e0; }
        .timeline-item.active .timeline-dot { background: #d32f2f; box-shadow: 0 0 0 4px #ffebee; }
        .timeline-item.active .timeline-title { color: #d32f2f; font-weight: bold; }
        .timeline-title { font-size: 14px; margin-bottom: 4px; color: #999; }
        .timeline-time { font-size: 12px; color: #aaa; }
        .close-btn { width: 100%; padding: 14px; background: #fff; border: 1px solid #eee; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #eee; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 12px; color: #999; cursor: pointer; }
        .nav-item.active { color: #d32f2f; font-weight: 600; }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center;">
            <div class="logo">DZPJ <span>RWA</span></div>
            <select class="lang-selector" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
        </div>
        <div id="userStatus"></div>
        <button id="connectBtn" onclick="connectPi()" data-i18n="connect">Connect Wallet</button>
    </header>

    <div id="page-home" class="page active">
        <div class="filter-tabs">
            <div class="filter-tab active" onclick="filterCategory('all', this)" data-i18n="all">全部</div>
            <div class="filter-tab" onclick="filterCategory('spice', this)" data-i18n="spices">香料</div>
            <div class="filter-tab" onclick="filterCategory('halal', this)" data-i18n="halal">清真食品</div>
        </div>
        <div id="product-list"></div>
    </div>

    <div id="page-detail" class="page">
        <div class="back-btn" onclick="switchPage('home')" data-i18n="back">← 返回</div>
        <div id="detail-content"></div>
    </div>

    <div id="page-cart" class="page">
        <h2 style="font-size: 20px; margin-bottom: 16px;" data-i18n="cart">购物车</h2>
        <div id="cart-list"></div>
        <div id="cart-summary" style="display: none; background: #fff; padding: 16px; border-radius: 12px; margin-top: 16px;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 16px;">
                <span data-i18n="total">总计:</span>
                <span style="color: #d32f2f;" id="cart-total-price">0</span>
            </div>
            <button class="pay-btn" onclick="checkoutCart()" data-i18n="checkout">去结算</button>
        </div>
    </div>

    <div id="page-profile" class="page">
        <div class="profile-header">
            <div style="font-size: 40px; margin-bottom: 10px;">👤</div>
            <h2 id="profile-username" style="font-size: 18px;" data-i18n="not_connected">未连接钱包</h2>
        </div>
        
        <div class="detail-box">
            <h3 data-i18n="address_title">收货信息管理</h3>
            <div class="form-group">
                <label data-i18n="receiver_name">收件人姓名</label>
                <input type="text" id="user-name" placeholder="请输入真实姓名" onchange="saveAddressInfo()">
            </div>
            <div class="form-group">
                <label data-i18n="phone">联系电话</label>
                <div class="phone-group">
                    <input type="text" id="user-code" placeholder="+86" onchange="saveAddressInfo()">
                    <input type="tel" id="user-phone" placeholder="手机号码" onchange="saveAddressInfo()">
                </div>
            </div>
            <div class="form-group">
                <label data-i18n="detail_address">详细地址</label>
                <input type="text" id="user-address" placeholder="省、市、区、街道门牌号" onchange="saveAddressInfo()">
            </div>
        </div>

        <div class="detail-box">
            <h3 data-i18n="orders_title">我的订单 (消费记录)</h3>
            <p style="font-size: 12px; color: #999; margin-bottom: 10px;" data-i18n="click_order_hint">👉 点击订单卡片可查看物流动态</p>
            <div id="order-list"></div>
        </div>
    </div>

    <!-- 物流详情弹窗 -->
    <div id="logistics-modal" class="modal-overlay" onclick="closeLogistics(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="font-size: 18px; margin-bottom: 16px; text-align: center;" data-i18n="logistics_title">物流跟踪</h2>
            
            <div class="logistics-header">
                <h3 id="modal-status-title">运输中</h3>
                <div class="logistics-row"><span data-i18n="carrier">承运公司</span><span id="modal-carrier">DHL Express / 顺丰国际</span></div>
                <div class="logistics-row"><span data-i18n="tracking_no">运单号</span><span id="modal-track-no">SF1234567890</span></div>
                <div class="logistics-row"><span data-i18n="estimated_delivery">预计送达</span><span id="modal-est-time" style="color:#d32f2f; font-weight:bold;">3-5 Days</span></div>
            </div>

            <div class="timeline" id="timeline-container"></div>
            <button class="close-btn" onclick="closeLogistics()" data-i18n="close">关闭</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchPage('home')">
            <span class="nav-icon">🏠</span><span data-i18n="home">首页</span>
        </div>
        <div class="nav-item" id="nav-cart" onclick="switchPage('cart')">
            <span class="nav-icon">🛒</span><span data-i18n="cart">购物车</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchPage('profile')">
            <span class="nav-icon">👤</span><span data-i18n="profile">我的</span>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://sqxeyzzoxwytecqktaqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_72-nfp11uFWf5kv6_qKViA_jp_OZA5S'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        Pi.init({ version: "2.0", sandbox: true });
        let isAuthenticated = false;
        let currentUser = null;
        let allProducts = [];
        let currentLang = 'zh';
        
        // 购物车只存 { id, qty }
        let cart = []; 
        let addressInfo = JSON.parse(localStorage.getItem('dzpj_address_info')) || { name: '', code: '+86', phone: '', address: '' };

        const dict = {
            zh: { connect: "连接钱包", all: "全部", spices: "香料", halal: "清真食品", back: "← 返回", not_connected: "未连接钱包", home: "首页", cart: "购物车", profile: "我的", orders_title: "我的订单 (消费记录)", address_title: "收货信息管理", receiver_name: "收件人姓名", phone: "联系电话", detail_address: "详细地址", total: "总计", checkout: "去结算", add_cart: "加入购物车", no_orders: "暂无订单记录", empty_cart: "购物车空空如也", pay: "支付", origin: "产地", effect_med: "中药功效", effect_season: "调味/食用特点", craft: "制作工艺", history: "历史由来", click_order_hint: "👉 点击订单卡片可查看物流动态", logistics_title: "物流跟踪", carrier: "承运公司", tracking_no: "运单号", estimated_delivery: "预计送达", close: "关闭", status_shipped: "运输中", status_pending: "待发货",
                log_created: "买家已付款，订单生成成功", log_processing: "商家已备货，等待揽收", log_picked: "【中国德州集散中心】已揽收", log_transit: "【上海国际转运中心】已发出，发往目的国", log_customs: "快件已到达目的国海关，正在清关中", log_delivery: "【派送中】快递员正在派送，请保持电话畅通", log_signed: "已签收，感谢您的购买" },
            
            en: { connect: "Connect Wallet", all: "All", spices: "Spices", halal: "Halal Food", back: "← Back", not_connected: "Not Connected", home: "Home", cart: "Cart", profile: "Profile", orders_title: "My Orders (History)", address_title: "Shipping Info", receiver_name: "Receiver Name", phone: "Phone Number", detail_address: "Detailed Address", total: "Total", checkout: "Checkout", add_cart: "Add to Cart", no_orders: "No orders", empty_cart: "Cart is empty", pay: "Pay", origin: "Origin", effect_med: "TCM Effect", effect_season: "Culinary Feature", craft: "Craftsmanship", history: "History", click_order_hint: "👉 Click order card to track logistics", logistics_title: "Logistics Tracking", carrier: "Carrier", tracking_no: "Tracking No.", estimated_delivery: "Est. Delivery", close: "Close", status_shipped: "In Transit", status_pending: "Pending",
                log_created: "Buyer paid, order generated", log_processing: "Merchant processing, awaiting pickup", log_picked: "Picked up at [Dezhou Distribution Center, China]", log_transit: "Departed from [Shanghai International Transit Center]", log_customs: "Arrived at destination customs, clearing", log_delivery: "[Out for Delivery] Courier is delivering", log_signed: "Delivered, thank you" },
            
            ar: { connect: "ربط المحفظة", all: "الكل", spices: "التوابل", halal: "طعام حلال", back: "← رجوع", not_connected: "غير متصل", home: "الرئيسية", cart: "عربة التسوق", profile: "حسابي", orders_title: "طلباتي (السجل)", address_title: "معلومات الشحن", receiver_name: "اسم المستلم", phone: "رقم الهاتف", detail_address: "العنوان التفصيلي", total: "الإجمالي", checkout: "الدفع", add_cart: "أضف إلى السلة", no_orders: "لا توجد طلبات", empty_cart: "السلة فارغة", pay: "دفع", origin: "المنشأ", effect_med: "تأثير طبي", effect_season: "ميزة الطهي", craft: "الحرفية", history: "التاريخ", click_order_hint: "👉 انقر على الطلب لتتبع الشحن", logistics_title: "تتبع الشحن", carrier: "شركة النقل", tracking_no: "رقم التتبع", estimated_delivery: "التوصيل المتوقع", close: "إغلاق", status_shipped: "قيد النقل", status_pending: "قيد الانتظار",
                log_created: "دفع المشتري، تم إنشاء الطلب", log_processing: "التاجر يعالج، في انتظار الاستلام", log_picked: "تم الاستلام في [مركز توزيع دتشو، الصين]", log_transit: "غادر من [مركز شنغهاي الدولي]", log_customs: "وصل إلى جمارك الوجهة، جاري التخليص", log_delivery: "[قيد التوصيل] المندوب في الطريق", log_signed: "تم التوصيل، شكراً لك" }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(dict[lang][key]) el.innerText = dict[lang][key];
            });
            renderProducts('all');
            renderCart(); // 语言切换时重新渲染购物车
        }

        function getUnit(category) {
            if(currentLang === 'zh') return category === 'spice' ? '公斤' : '盒';
            if(currentLang === 'ar') return category === 'spice' ? 'كغ' : 'صندوق';
            return category === 'spice' ? 'kg' : 'box';
        }

        function getTrans(p, field) {
            const langField = `${field}_${currentLang}`;
            if (currentLang === 'zh') return p[field] || '';
            return p[langField] || p[field] || ''; 
        }

        function getProductName(p) { return getTrans(p, 'name'); }

        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
            if (!error) { 
                allProducts = data; 
                renderProducts('all'); 
                // 页面加载时，如果有本地临时购物车，先渲染出来（其实如果登录了会覆盖）
                renderCart();
            }
        }

        function renderProducts(filter) {
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = '';
            let filtered = filter === 'all' ? allProducts : allProducts.filter(p => p.category === filter);
            
            filtered.forEach(p => {
                listEl.innerHTML += `
                    <div class="card" onclick="showDetail(${p.id})">
                        <img src="${p.image_url}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1596797038530-2c107229654b?w=400'">
                        <div class="card-info">
                            <div class="card-title">${getProductName(p)}</div>
                            <div class="card-price">${p.price} Pi / ${getUnit(p.category)}</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(category, el) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderProducts(category);
        }

        function showDetail(id) {
            const p = allProducts.find(item => item.id === id);
            const detailEl = document.getElementById('detail-content');
            const unit = getUnit(p.category);
            const dictLang = dict[currentLang];
            
            const medText = getTrans(p, 'effect_med');
            const seasonText = getTrans(p, 'effect_season');
            const craftText = getTrans(p, 'craft');
            const historyText = getTrans(p, 'history');
            const originText = getTrans(p, 'origin');

            let detailHtml = '';
            if (originText || medText || seasonText || craftText || historyText) {
                detailHtml = `
                    <div class="detail-box">
                        <h3>${dictLang.origin}: ${originText || 'China'}</h3>
                        ${medText ? `<div class="detail-desc"><b>${dictLang.effect_med}:</b> ${medText}</div>` : ''}
                        ${seasonText ? `<div class="detail-desc"><b>${dictLang.effect_season}:</b> ${seasonText}</div>` : ''}
                        ${craftText ? `<div class="detail-desc"><b>${dictLang.craft}:</b> ${craftText}</div>` : ''}
                        ${historyText ? `<div class="detail-desc"><b>${dictLang.history}:</b> ${historyText}</div>` : ''}
                    </div>
                `;
            }

            detailEl.innerHTML = `
                <img src="${p.image_url}" class="detail-img" onerror="this.src='https://images.unsplash.com/photo-1596797038530-2c107229654b?w=400'">
                <h2 style="font-size: 22px; margin-bottom: 8px;">${getProductName(p)}</h2>
                <div style="color: #d32f2f; font-size: 24px; font-weight: bold; margin-bottom: 16px;">${p.price} Pi / ${unit}</div>
                ${detailHtml}
                <button class="pay-btn" onclick="addToCart(${p.id})" data-i18n="add_cart">加入购物车</button>
            `;
            switchPage('detail');
        }

        // --- 购物车云端同步逻辑 ---
        async function addToCart(id) {
            if(!currentUser) { alert("请先连接钱包"); return; }
            
            const existing = cart.find(item => item.id === id);
            if(existing) { existing.qty += 1; } else {
                cart.push({ id: id, qty: 1 });
            }
            
            await syncCartToCloud(); // 每次加购直接同步云端
            alert(dict[currentLang].add_cart + " Success!");
        }

        async function syncCartToCloud() {
            if (!currentUser) return;
            
            // 策略：全删全插（最简单粗暴且不出错）
            await supabaseClient.from('carts').delete().eq('username', currentUser);
            
            if (cart.length > 0) {
                const insertData = cart.map(item => ({
                    username: currentUser,
                    product_id: item.id,
                    qty: item.qty
                }));
                await supabaseClient.from('carts').insert(insertData);
            }
            renderCart();
        }

        async function loadCartFromCloud() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient.from('carts').select('*').eq('username', currentUser);
            if (!error && data) {
                cart = data.map(item => ({ id: item.product_id, qty: item.qty }));
                renderCart();
            }
        }

        function renderCart() {
            const listEl = document.getElementById('cart-list');
            const summaryEl = document.getElementById('cart-summary');
            const totalEl = document.getElementById('cart-total-price');
            
            if(cart.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:#999; margin-top:20px;">${dict[currentLang].empty_cart}</p>`;
                summaryEl.style.display = 'none';
                return;
            }
            
            listEl.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                const p = allProducts.find(prod => prod.id === item.id);
                if (!p) return;
                
                total += p.price * item.qty;
                listEl.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div style="font-weight:bold;">${getProductName(p)}</div>
                            <div style="color:#d32f2f; font-size:14px; margin-top:4px;">${p.price} Pi / ${getUnit(p.category)}</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            totalEl.innerText = total.toFixed(1) + " Pi";
            summaryEl.style.display = 'block';
        }

        async function updateQty(index, change) {
            cart[index].qty += change;
            if(cart[index].qty <= 0) cart.splice(index, 1);
            await syncCartToCloud(); 
        }

        function saveAddressInfo() {
            addressInfo = {
                name: document.getElementById('user-name').value,
                code: document.getElementById('user-code').value,
                phone: document.getElementById('user-phone').value,
                address: document.getElementById('user-address').value
            };
            localStorage.setItem('dzpj_address_info', JSON.stringify(addressInfo));
        }

        async function checkoutCart() {
            if (!isAuthenticated) { alert("请先连接钱包"); return; }
            if (!addressInfo.name || !addressInfo.code || !addressInfo.phone || !addressInfo.address) { 
                alert("请先去【我的】页面填写完整的姓名、区号、电话和地址！"); 
                switchPage('profile'); 
                return; 
            }
            if (cart.length === 0) return;

            let totalAmount = 0;
            let itemNames = [];
            cart.forEach(item => {
                const p = allProducts.find(prod => prod.id === item.id);
                if(p) {
                    totalAmount += p.price * item.qty;
                    itemNames.push(`${getProductName(p)}x${item.qty}`);
                }
            });

            try {
                await Pi.createPayment({
                    amount: totalAmount,
                    memo: "购物车结算: " + itemNames.join(', '),
                    metadata: { cart: cart, addressInfo: addressInfo }
                }, {
                    onReadyForServerApproval: async (paymentId) => {
                        await fetch('/api/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId }) });
                    },
                    onReadyForServerCompletion: async function(paymentId, txid) {
                        const res = await fetch('/api/complete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId, txid }) });
                        if (res.ok) {
                            await supabaseClient.from('orders').insert([{ 
                                username: currentUser, 
                                item_name: itemNames.join(', '), 
                                amount: totalAmount, 
                                txid: txid,
                                address: addressInfo.address,
                                receiver_name: addressInfo.name,
                                country_code: addressInfo.code,
                                phone: addressInfo.phone,
                                status: '待发货'
                            }]);
                            alert(`支付成功！已生成订单。`);
                            cart = [];
                            await syncCartToCloud();
                            switchPage('home');
                        } else {
                            alert("防刷单校验失败！");
                        }
                    },
                    onCancel: function() { alert("支付取消"); },
                    onError: function(error) { alert("支付错误"); }
                });
            } catch (error) { alert("创建支付失败"); }
        }

        async function fetchOrders() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient.from('orders').select('*').eq('username', currentUser).order('created_at', { ascending: false });
            const listEl = document.getElementById('order-list');
            if (error || data.length === 0) {
                listEl.innerHTML = `<p style="font-size: 13px; color: #999; text-align: center;">${dict[currentLang].no_orders}</p>`;
                return;
            }
            listEl.innerHTML = '';
            
            window.userOrders = data;

            data.forEach((order, index) => {
                listEl.innerHTML += `
                    <div class="order-card" onclick="showLogistics(${index})">
                        <div class="order-title">
                            <span>${order.item_name}</span>
                            <span style="color:#d32f2f;">${order.amount} Pi</span>
                        </div>
                        <div class="order-info">收件人: ${order.receiver_name || '未填'} (${order.country_code || ''} ${order.phone || ''})</div>
                        <div class="order-info">地址: ${order.address || '未填'}</div>
                        <div class="order-status-tag">${order.status || '待发货'} &gt;</div>
                    </div>
                `;
            });
        }

        function showLogistics(index) {
            const order = window.userOrders[index];
            const modal = document.getElementById('logistics-modal');
            const timeline = document.getElementById('timeline-container');
            const dictLang = dict[currentLang];

            const orderTime = new Date(order.created_at);
            const formatTime = (date) => {
                return `${date.getMonth()+1}月${date.getDate()}日 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
            };
            const estDeliveryDate = new Date(orderTime);
            estDeliveryDate.setDate(estDeliveryDate.getDate() + 5);
            const estDeliveryStr = `${estDeliveryDate.getMonth()+1}月${estDeliveryDate.getDate()}日`;

            document.getElementById('modal-status-title').innerText = dictLang.status_shipped;
            document.getElementById('modal-est-time').innerText = estDeliveryStr;
            document.getElementById('modal-track-no').innerText = "SF" + Math.floor(Math.random() * 10000000000);

            const logData = [
                { time: new Date(orderTime.getTime() + 1000 * 60 * 60 * 24 * 2), title: dictLang.log_transit, active: true },
                { time: new Date(orderTime.getTime() + 1000 * 60 * 60 * 24 * 1.5), title: dictLang.log_picked, active: true },
                { time: new Date(orderTime.getTime() + 1000 * 60 * 60 * 24 * 1), title: dictLang.log_processing, active: true },
                { time: orderTime, title: dictLang.log_created, active: true }
            ];

            timeline.innerHTML = '';
            logData.forEach(log => {
                timeline.innerHTML += `
                    <div class="timeline-item ${log.active ? 'active' : ''}">
                        <div class="timeline-dot"></div>
                        <div class="timeline-title">${log.title}</div>
                        <div class="timeline-time">${formatTime(log.time)}</div>
                    </div>
                `;
            });

            modal.classList.add('active');
        }

        function closeLogistics(e) {
            if(e && e.target !== e.currentTarget) return;
            document.getElementById('logistics-modal').classList.remove('active');
        }

        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageName}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`nav-${pageName}`).classList.add('active');
            
            if(pageName === 'profile') {
                document.getElementById('user-name').value = addressInfo.name;
                document.getElementById('user-code').value = addressInfo.code;
                document.getElementById('user-phone').value = addressInfo.phone;
                document.getElementById('user-address').value = addressInfo.address;
                fetchOrders(); 
            } else if(pageName === 'cart') {
                renderCart();
            }
        }

        async function connectPi() {
            try {
                document.getElementById('connectBtn').innerText = "...";
                const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
                isAuthenticated = true;
                currentUser = auth.user.username;
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('userStatus').innerText = '✅ ' + currentUser;
                document.getElementById('userStatus').style.display = 'block';
                document.getElementById('profile-username').innerText = currentUser;
                
                // 关键：登录成功后，拉取云端购物车
                await loadCartFromCloud();
            } catch (err) {
                document.getElementById('connectBtn').innerText = dict[currentLang].connect;
                alert("连接失败: " + (err.message || err));
            }
        }

        function onIncompletePaymentFound(payment) { console.log("未完成支付:", payment); }

        window.addEventListener('load', () => { fetchProducts(); });
    </script>
</body>
</html>
