<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZPJ Trade - 商家管理后台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #fff; padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h1 { font-size: 20px; color: #d32f2f; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab.active { background: #d32f2f; color: #fff; }

        .panel { display: none; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .panel.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #fafafa; font-weight: bold; color: #666; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; background: #fff3e0; color: #e65100; }
        
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; color: #fff; background: #2196f3; }
        .btn:hover { opacity: 0.8; }
        .btn-green { background: #4caf50; }
        .btn-red { background: #f44336; }

        /* 新增商品表单 */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; margin-bottom: 5px; color: #666; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>DZPJ Trade - 商家控制台</h1>
        <span style="font-size:13px; color:#666;">当前身份：管理员</span>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('orders')">📦 订单管理</button>
        <button class="tab" onclick="switchTab('products')">🌿 商品管理</button>
    </div>

    <!-- 订单管理面板 -->
    <div id="panel-orders" class="panel active">
        <h2 style="font-size:16px; margin-bottom:15px;">所有用户订单</h2>
        <table>
            <thead>
                <tr>
                    <th>时间</th>
                    <th>买家账号</th>
                    <th>商品信息</th>
                    <th>收件人</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="order-table-body">
                <tr><td colspan="6" style="text-align:center;">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 商品管理面板 -->
    <div id="panel-products" class="panel">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <h2 style="font-size:16px;">商品列表</h2>
            <button class="btn btn-green" onclick="alert('为了演示简便，添加商品功能可参考之前的SQL语法，或者后续开发完整表单。')">+ 新增商品</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>名称</th>
                    <th>分类</th>
                    <th>价格 (Pi)</th>
                    <th>库存</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="product-table-body">
                <tr><td colspan="6" style="text-align:center;">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 填入你的 Supabase 配置
    const SUPABASE_URL = 'https://sqxeyzzoxwytecqktaqs.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_72-nfp11uFWf5kv6_qKViA_jp_OZA5S'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(`panel-${tab}`).classList.add('active');
        
        if(tab === 'orders') fetchOrders();
        if(tab === 'products') fetchProducts();
    }

    // 加载订单
    async function fetchOrders() {
        const tbody = document.getElementById('order-table-body');
        const { data, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
        
        if (error || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">暂无订单</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        data.forEach(order => {
            const date = new Date(order.created_at).toLocaleString();
            tbody.innerHTML += `
                <tr>
                    <td>${date}</td>
                    <td>${order.username}</td>
                    <td>${order.item_name}<br><span style="font-size:12px;color:#d32f2f;">${order.amount} Pi</span></td>
                    <td>${order.receiver_name}<br><span style="font-size:12px;">${order.country_code} ${order.phone}</span><br><span style="font-size:12px; color:#888;">${order.address}</span></td>
                    <td><span class="status-badge">${order.status}</span></td>
                    <td>
                        ${order.status === '待发货' 
                            ? `<button class="btn" onclick="updateOrderStatus(${order.id}, '已发货')">标记发货</button>` 
                            : `<button class="btn btn-green" onclick="updateOrderStatus(${order.id}, '已签收')">标记签收</button>`}
                    </td>
                </tr>
            `;
        });
    }

    // 更新订单状态
    async function updateOrderStatus(orderId, newStatus) {
        if(!confirm(`确定要将订单状态改为【${newStatus}】吗？`)) return;
        
        const { error } = await supabaseClient.from('orders').update({ status: newStatus }).eq('id', orderId);
        if (error) {
            alert("更新失败：" + error.message);
        } else {
            alert("更新成功！");
            fetchOrders(); // 刷新列表
        }
    }

    // 加载商品
    async function fetchProducts() {
        const tbody = document.getElementById('product-table-body');
        const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
        
        if (error) return;
        tbody.innerHTML = '';
        data.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.category === 'spice' ? '香料' : '清真食品'}</td>
                    <td style="color:#d32f2f; font-weight:bold;">${p.price} Pi</td>
                    <td>${p.stock}</td>
                    <td><button class="btn" onclick="alert('库存修改功能开发中')">编辑</button></td>
                </tr>
            `;
        });
    }

    // 默认加载订单
    window.addEventListener('load', fetchOrders);
</script>
</body>
</html>
